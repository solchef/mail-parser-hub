<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Mail Parser API Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-panel: rgba(25, 32, 45, 0.85);
            --glass: rgba(255, 255, 255, 0.05);
            --accent: #3b82f6;
            --accent-glow: 0 0 12px rgba(59, 130, 246, 0.6);
            --text-light: #e2e8f0;
            --text-bright: #f8fafc;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 14px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        body {
            margin: 0;
            font-family: "Inter", "Segoe UI", sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== Sidebar ===== */
        #sidebar {
            width: 270px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            color: var(--text-light);
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #sidebar h2 {
            color: var(--text-bright);
            font-size: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #searchInput {
            background: #1e2636;
            color: #f1f5f9;
            border: none;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            outline: none;
            font-size: 14px;
        }

        #tagList {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #tagList a {
            display: block;
            padding: 10px 12px;
            color: #cbd5e1;
            font-size: 14px;
            border-radius: 8px;
            transition: 0.2s;
        }

        #tagList a:hover,
        #tagList a.active {
            background: var(--accent);
            color: white;
            box-shadow: var(--accent-glow);
            transform: translateX(3px);
        }

        /* ===== Top Bar ===== */
        #topBar {
            position: fixed;
            left: 300px;
            right: 0;
            top: 0;
            height: 60px;
            background: transparent;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
        }

        #topBar h1 {
            font-size: 18px;
            color: white;
            font-weight: 600;
        }

        /* ===== Swagger area ===== */
        #swagger-ui {
            flex: 1;
            /* margin-left: 150px; */
            /* margin-top: 60px; */
            /* padding: 40px 60px; */
            overflow-y: auto;
            height: calc(100vh - 60px);
        }

        .swagger-ui {
            max-width: 1200px;
            margin: auto;
        }

        .swagger-ui .info {
            background: transparent;
            margin-top: 40px;
            border-radius: var(--radius);
            /* border: 1px solid var(--border);
            box-shadow: var(--shadow); */
            color: var(--text-light);
        }

        .swagger-ui .info hgroup.main h2,
        .swagger-ui .info p {
            color: var(--text-light) !important;
        }

        .swagger-ui .opblock {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .swagger-ui .opblock-summary-method {
            border-radius: 6px;
            padding: 4px 12px;
            font-weight: 600;
        }

        .swagger-ui .opblock.opblock-post {
            border-left: 5px solid #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .swagger-ui .opblock.opblock-get {
            border-left: 5px solid var(--accent);
            background: rgba(59, 130, 246, 0.1);
        }

        .swagger-ui .opblock.opblock-delete {
            border-left: 5px solid #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .swagger-ui .opblock.opblock-put {
            border-left: 5px solid #eab308;
            background: rgba(234, 179, 8, 0.1);
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <h2>📬 Mail Parser API</h2>
        <input type="text" id="searchInput" placeholder="Search modules..." />
        <ul id="tagList"></ul>
    </div>

    <!-- <div id="topBar">
        <h1>API Explorer</h1>
    </div> -->

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>
    <script>
        const ui = SwaggerUIBundle({
            url: "/swagger.json",
            dom_id: "#swagger-ui",
            deepLinking: true,
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            layout: "BaseLayout",
            docExpansion: "list",
            syntaxHighlight: { theme: "obsidian" },
        });

        // Sidebar builder
        const waitForTags = () => {
            const tags = document.querySelectorAll(".opblock-tag-section");
            if (tags.length === 0) return setTimeout(waitForTags, 400);

            const list = document.getElementById("tagList");
            list.innerHTML = "";
            tags.forEach(tag => {
                const id = tag.querySelector(".opblock-tag")?.id;
                const name = tag.querySelector(".opblock-tag")?.innerText || id;
                if (!id) return;

                const a = document.createElement("a");
                a.href = "#" + id;
                a.textContent = name;
                a.onclick = e => {
                    e.preventDefault();
                    document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
                    list.querySelectorAll("a").forEach(el => el.classList.remove("active"));
                    a.classList.add("active");
                };
                list.appendChild(a);
            });

            // Search filter
            document.getElementById("searchInput").addEventListener("input", e => {
                const q = e.target.value.toLowerCase();
                list.querySelectorAll("a").forEach(a => {
                    a.style.display = a.textContent.toLowerCase().includes(q) ? "block" : "none";
                });
            });
        };

        setTimeout(waitForTags, 1200);
    </script>

</body>

</html>
