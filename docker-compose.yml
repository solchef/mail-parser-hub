services:
  backend:
    build:
      context: ./mail-parser-backend
      dockerfile: Dockerfile
    env_file: ./mail-parser-backend/.env
    ports:
      - "4000:4000"
    restart: always

  frontend:
    build:
      context: ./mail-parser-client
      dockerfile: Dockerfile
    env_file: ./mail-parser-client/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
